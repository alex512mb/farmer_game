<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Clank Flow</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #unity-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            background: #000;
        }

        #unity-warning {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            z-index: 10;
            display: none;
            pointer-events: none;
        }

        #unity-loading {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #000;
            pointer-events: none;
        }

        #unity-loading-bar {
            width: min(320px, 70vw);
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        #unity-loading-bar-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: #fff;
            transition: width 0.15s ease-out;
        }

        #unity-loading-text {
            color: rgba(255, 255, 255, 0.85);
            font: 14px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
<div id="unity-container">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
    <div id="unity-loading">
        <div id="unity-loading-bar">
            <div id="unity-loading-bar-fill"></div>
        </div>
        <div id="unity-loading-text">0%</div>
    </div>
    <div id="unity-warning"></div>
</div>
<script>
    var canvas = document.querySelector("#unity-canvas");
    var container = document.querySelector("#unity-container");
    var loadingOverlay = document.querySelector("#unity-loading");
    var progressFill = document.querySelector("#unity-loading-bar-fill");
    var progressText = document.querySelector("#unity-loading-text");

    canvas.addEventListener("contextmenu", function (event) {
        event.preventDefault();
    });

    function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") {
            div.style.cssText = "background: #c00; color: #fff; padding: 10px;";
        } else if (type === "warning") {
            div.style.cssText = "background: #fc0; color: #000; padding: 10px;";
            setTimeout(function () {
                warningBanner.removeChild(div);
                updateBannerVisibility();
            }, 5000);
        }

        updateBannerVisibility();
    }

    function fillContainer() {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        window.focus();
    }

    function updateLoadingProgress(progress) {
        var percent = Math.min(100, Math.round(progress * 100));
        progressFill.style.width = percent + "%";
        progressText.textContent = percent + "%";
    }

    function hideLoadingOverlay() {
        loadingOverlay.style.display = "none";
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/uncompresed_1.loader.js";
    var config = {
        arguments: [],
        dataUrl: buildUrl + "/uncompresed_1.data",
        frameworkUrl: buildUrl + "/uncompresed_1.framework.js",
        codeUrl: buildUrl + "/uncompresed_1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Nice Pixel",
        productName: "Clank Flow",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = 1;
    }

    fillContainer();
    window.addEventListener("resize", fillContainer);

    if (window.ResizeObserver) {
        new ResizeObserver(fillContainer).observe(container);
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
        createUnityInstance(canvas, config, updateLoadingProgress).then(function () {
            updateLoadingProgress(1);
            hideLoadingOverlay();
            fillContainer();
        }).catch(function (message) {
            alert(message);
        });
    };

    document.body.appendChild(script);
</script>
</body>
</html>
